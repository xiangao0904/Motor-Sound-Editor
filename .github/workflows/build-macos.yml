name: Build macOS

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-universal:
    name: Build universal macOS package
    runs-on: macos-14
    env:
      APPLE_SIGNING_IDENTITY: "-"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build universal app and DMG
        run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Prepare artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          bundle_dir="src-tauri/target/universal-apple-darwin/release/bundle"
          dmg_path="$(find "$bundle_dir/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"
          app_path="$(find "$bundle_dir/macos" -maxdepth 1 -name '*.app' -type d -print -quit)"

          test -n "$dmg_path"
          test -n "$app_path"
          mkdir -p artifacts
          cp "$dmg_path" "artifacts/Motor-Sound-Editor-${version}-macOS-universal.dmg"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" \
            "artifacts/Motor-Sound-Editor-${version}-macOS-universal.zip"
          (cd artifacts && shasum -a 256 ./* > SHA256SUMS.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motor-Sound-Editor-${{ steps.package.outputs.version }}-macOS-universal
          path: artifacts/*
          if-no-files-found: error
